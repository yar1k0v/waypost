name: release
# Tag vX.Y.Z → ghcr.io/yar1k0v/waypost-server:X.Y.Z and waypost-builder:X.Y.Z.
on:
  push:
    tags: ["v*.*.*"]
permissions:
  contents: read
  packages: write
jobs:
  images:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        target: [server, builder]
    steps:
      - uses: actions/checkout@v4
      - name: Version from tag
        id: v
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: ${{ matrix.target }}
          push: true
          tags: |
            ghcr.io/yar1k0v/waypost-${{ matrix.target }}:${{ steps.v.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/yar1k0v/waypost
            org.opencontainers.image.version=${{ steps.v.outputs.version }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
