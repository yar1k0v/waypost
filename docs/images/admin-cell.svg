<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>Exact admin-area test inside one grid cell: count crossings from the cell centre to the query point</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="640" height="360" rx="16" fill="#f8fafc"/>

  <!-- grid -->
  <g stroke="#cbd5e1" stroke-width="1">
    <line x1="40" y1="40" x2="40" y2="320"/><line x1="180" y1="40" x2="180" y2="320"/>
    <line x1="320" y1="40" x2="320" y2="320"/><line x1="460" y1="40" x2="460" y2="320"/>
    <line x1="40" y1="40" x2="460" y2="40"/><line x1="40" y1="180" x2="460" y2="180"/>
    <line x1="40" y1="320" x2="460" y2="320"/>
  </g>

  <!-- area (district) with a border crossing the middle cell -->
  <path d="M40,40 L290,40 L275,120 L320,175 L300,250 L260,320 L40,320 z" fill="#bfdbfe" fill-opacity="0.7" stroke="#2563eb" stroke-width="2.5"/>

  <!-- highlighted cell -->
  <rect x="180" y="40" width="140" height="140" fill="none" stroke="#0f172a" stroke-width="2.5" stroke-dasharray="6 4"/>
  <text x="250" y="32" text-anchor="middle" font-size="12" fill="#0f172a">query cell</text>

  <!-- centre and query -->
  <circle cx="250" cy="110" r="5" fill="#0f172a"/>
  <text x="236" y="104" text-anchor="end" font-size="12" fill="#0f172a">centre C</text>
  <circle cx="300" cy="140" r="6" fill="#dc2626"/>
  <text x="306" y="158" font-size="12" fill="#dc2626">query Q</text>
  <line x1="250" y1="110" x2="295" y2="137" stroke="#dc2626" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#a)"/>

  <!-- legend -->
  <g font-size="13" fill="#1e293b">
    <text x="480" y="66" font-weight="600">Stored per cell</text>
    <text x="480" y="90">• area id</text>
    <text x="480" y="110">• is C inside? (yes)</text>
    <text x="480" y="130">• edges touching</text>
    <text x="492" y="148">the cell (3)</text>
    <text x="480" y="186" font-weight="600">Lookup</text>
    <text x="480" y="210">crossings of C→Q</text>
    <text x="480" y="228">with those edges: 1</text>
    <text x="480" y="252">odd → flip: Q is</text>
    <text x="480" y="270" font-weight="600" fill="#dc2626">outside</text>
    <text x="480" y="300" font-size="12" fill="#475569">Exact integer math.</text>
    <text x="480" y="316" font-size="12" fill="#475569">No simplified borders.</text>
  </g>
</svg>
