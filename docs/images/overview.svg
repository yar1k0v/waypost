<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 340" width="1020" height="340" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>waypost pipeline: download OSM extracts, prepare with osmium, build one index file, serve it over HTTP</title>
  <style>
    .bg{fill:#ffffff;stroke:#d0d7de}
    .card{fill:#f6f8fa;stroke:#d0d7de}
    .t{fill:#1f2328}
    .m{fill:#59636e}
    .ln{stroke:#8c959f}
    .ar{fill:#8c959f}
    .c1{fill:#8250df} .c2{fill:#bf3989} .c3{fill:#0969da} .c4{fill:#9a6700} .c5{fill:#1a7f37}
    .pill{fill:#eaeef2}
    @media (prefers-color-scheme: dark){
      .bg{fill:#0d1117;stroke:#30363d}
      .card{fill:#161b22;stroke:#30363d}
      .t{fill:#e6edf3}
      .m{fill:#9198a1}
      .ln{stroke:#6e7681}
      .ar{fill:#6e7681}
      .c1{fill:#ab7df8} .c2{fill:#db61a2} .c3{fill:#4493f8} .c4{fill:#d29922} .c5{fill:#3fb950}
      .pill{fill:#21262d}
    }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" class="ar"/>
    </marker>
  </defs>
  <rect x="0.5" y="0.5" width="1019" height="339" rx="20" class="bg"/>

  <!-- step labels -->
  <g font-size="12" font-weight="600" letter-spacing="1">
    <text x="30" y="48" class="c1">1 · DOWNLOAD</text>
    <text x="230" y="48" class="c2">2 · PREPARE</text>
    <text x="430" y="48" class="c3">3 · BUILD</text>
    <text x="630" y="48" class="c4">4 · STORE</text>
    <text x="830" y="48" class="c5">5 · SERVE</text>
  </g>

  <!-- cards -->
  <g>
    <rect x="30" y="62" width="160" height="186" rx="12" class="card"/>
    <rect x="230" y="62" width="160" height="186" rx="12" class="card"/>
    <rect x="430" y="62" width="160" height="186" rx="12" class="card"/>
    <rect x="630" y="62" width="160" height="186" rx="12" class="card"/>
    <rect x="830" y="62" width="160" height="186" rx="12" class="card"/>
  </g>
  <g>
    <rect x="30" y="62" width="160" height="5" rx="2" class="c1"/>
    <rect x="230" y="62" width="160" height="5" rx="2" class="c2"/>
    <rect x="430" y="62" width="160" height="5" rx="2" class="c3"/>
    <rect x="630" y="62" width="160" height="5" rx="2" class="c4"/>
    <rect x="830" y="62" width="160" height="5" rx="2" class="c5"/>
  </g>

  <g font-size="16" font-weight="600" class="t" text-anchor="middle">
    <text x="110" y="100">OSM extracts</text>
    <text x="310" y="100">osmium-tool</text>
    <text x="510" y="100">waypost-builder</text>
    <text x="710" y="100">index file</text>
    <text x="910" y="100">waypost-server</text>
  </g>
  <g font-size="13" class="m" text-anchor="middle">
    <text x="110" y="132">.osm.pbf from Geofabrik</text>
    <text x="110" y="152">one or more countries</text>
    <text x="110" y="172">listed in waypost.env</text>

    <text x="310" y="132">roads and addresses</text>
    <text x="310" y="152">with node locations</text>
    <text x="310" y="172">boundary polygons</text>

    <text x="510" y="132">street and admin grids</text>
    <text x="510" y="152">translated names</text>
    <text x="510" y="172">border edges per cell</text>

    <text x="710" y="132">one .wpi file</text>
    <text x="710" y="152">versioned format</text>
    <text x="710" y="172">build settings inside</text>

    <text x="910" y="132">/v1/reverse · /v1/snap</text>
    <text x="910" y="152">batches of 10,000</text>
    <text x="910" y="172">memory-mapped, no locks</text>
  </g>

  <!-- measured numbers -->
  <g>
    <rect x="55" y="200" width="110" height="28" rx="14" class="pill"/>
    <rect x="255" y="200" width="110" height="28" rx="14" class="pill"/>
    <rect x="455" y="200" width="110" height="28" rx="14" class="pill"/>
    <rect x="655" y="200" width="110" height="28" rx="14" class="pill"/>
    <rect x="845" y="200" width="130" height="28" rx="14" class="pill"/>
  </g>
  <g font-size="13" font-weight="600" text-anchor="middle">
    <text x="110" y="219" class="c1">550 MB</text>
    <text x="310" y="219" class="c2">about 1 min</text>
    <text x="510" y="219" class="c3">10 s</text>
    <text x="710" y="219" class="c4">333 MB</text>
    <text x="910" y="219" class="c5">≈ 18 µs / lookup</text>
  </g>

  <!-- arrows -->
  <g stroke-width="2" class="ln" marker-end="url(#arr)">
    <line x1="192" y1="155" x2="226" y2="155"/>
    <line x1="392" y1="155" x2="426" y2="155"/>
    <line x1="592" y1="155" x2="626" y2="155"/>
    <line x1="792" y1="155" x2="826" y2="155"/>
  </g>

  <!-- service brackets -->
  <g fill="none" stroke-width="1.5" class="ln">
    <path d="M30,268 v8 h560 v-8"/>
    <path d="M630,268 v8 h360 v-8"/>
  </g>
  <g font-size="13" text-anchor="middle">
    <text x="310" y="300" class="t" font-weight="600">compose service <tspan font-family="ui-monospace, Consolas, monospace">index</tspan></text>
    <text x="310" y="320" class="m">runs once, skips when the settings did not change</text>
    <text x="810" y="300" class="t" font-weight="600">compose service <tspan font-family="ui-monospace, Consolas, monospace">server</tspan></text>
    <text x="810" y="320" class="m">reads the index volume, read-only</text>
  </g>
</svg>
