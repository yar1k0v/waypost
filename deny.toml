# cargo-deny: run by the `deny` job in .github/workflows/ci.yml.
# Local run: cargo deny check

[advisories]
version = 2
yanked = "deny"
ignore = [
    # memmap2 0.5 via osmpbf 0.3.8 (builder only, newest osmpbf on 2026-11-09).
    # osmpbf never calls the affected advise_range or flush_range functions.
    # Remove when osmpbf moves to memmap2 >= 0.9.11.
    { id = "RUSTSEC-2026-0186", reason = "affected functions unused by osmpbf" },
]

[licenses]
version = 2
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "MIT",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
